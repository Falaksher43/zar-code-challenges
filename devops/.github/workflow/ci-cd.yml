name: Flask App CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: flask-app
  KUBECONFIG_FILE: kubeconfig.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd simple-flask-app
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Setup kubectl
        uses: aws-actions/setup-kubectl@v1
        with:
          version: 'v1.24.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name flask-app-cluster --region ${{ env.AWS_REGION }} --kubeconfig ${{ env.KUBECONFIG_FILE }}

      - name: Deploy to Kubernetes
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Replace placeholder in deployment.yaml with actual ECR repo URL
          export ECR_REPOSITORY_URL=$ECR_REGISTRY/$ECR_REPOSITORY
          envsubst < kubernetes/deployment.yaml > kubernetes/deployment-updated.yaml

          # Apply Kubernetes manifests
          kubectl --kubeconfig=$KUBECONFIG_FILE apply -f kubernetes/configmap.yaml
          kubectl --kubeconfig=$KUBECONFIG_FILE apply -f kubernetes/deployment-updated.yaml
          kubectl --kubeconfig=$KUBECONFIG_FILE apply -f kubernetes/service.yaml

          # Wait for deployment to complete
          kubectl --kubeconfig=$KUBECONFIG_FILE rollout status deployment/flask-app

      - name: Get service URL
        run: |
          echo "Application deployed successfully! You can access it at:"
          kubectl --kubeconfig=$KUBECONFIG_FILE get service flask-app -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'